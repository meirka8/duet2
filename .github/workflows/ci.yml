name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep in lockstep with [workspace.package].rust-version in the root Cargo.toml.
  RUST_MSRV: "1.97"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  msrv:
    name: MSRV (${{ env.RUST_MSRV }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  dep-graph-lint:
    name: gpui isolation lint (ADR-002, T-2.1.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any crate outside duet-ui/duet-widgets depends on gpui
        run: ./scripts/check-gpui-isolation.sh

  perf-gate:
    name: performance regression gate (T-3.3.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The recorded baseline lives in git (benches/baselines/main/, committed
      # criterion output) rather than being regenerated on every run: CI
      # runners have too much noise/variance to be a trustworthy source of
      # truth for "what normal looks like" on every single job, and a
      # regenerate-every-time baseline can never actually catch a regression
      # introduced in the very commit being tested.
      # Only `estimates.json` is committed (not criterion's raw `sample.json`,
      # which is much larger and unnecessary here), so this run deliberately
      # does NOT pass `--baseline main` to `cargo bench` -- criterion's own
      # baseline-diff feature wants sample.json too and errors without it.
      # bench_gate does its own independent comparison directly against the
      # restored estimates.json files below, so criterion's built-in diffing
      # isn't needed at all; a plain run still writes fresh results to the
      # `new/` baseline every benchmark run always produces.
      - name: Restore baseline into criterion's expected location
        run: |
          mkdir -p target/criterion
          cp -r benches/baselines/main/* target/criterion/ 2>/dev/null || true
      - name: Run benchmarks
        run: cargo bench -p duet-bench --bench entry_store --bench local_listing
      - name: Check for regressions (fails the job on any >10% regression)
        run: cargo run -p duet-bench --bin bench_gate --release -- --baseline main --threshold 10
