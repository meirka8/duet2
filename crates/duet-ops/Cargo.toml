[package]
name = "duet-ops"
description = "Operation engine: planner, executor, journal, queue, conflict policy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
duet-types = { path = "../duet-types" }
# T-5.1.1: the planner walks a source tree through the `FileSystem` trait
# (design.md §9.1's abstraction every backend implements), not `std::fs`
# directly -- so a plan built for a local copy today keeps working once
# archive/remote backends exist (Phase 6/7). The obviously-intended edge:
# `duet-ops` sits right after `duet-vfs` in design.md §7.5/§8.1's crate list
# precisely because the operation engine consumes the VFS layer.
duet-vfs = { path = "../duet-vfs" }
serde.workspace = true
# `FileSystem::read_dir`'s `BoxStream` needs `StreamExt::next()` to consume.
futures-util.workspace = true
# T-5.1.2: the journal's on-disk wire format (newline-delimited JSON, one
# `JournalRecord` per line -- see `journal.rs`'s module doc comment). T-2.3.1
# only ever needed this as a *test* round-trip format for `Plan`; now that
# `Journal::append`/`JournalReader::scan` actually read and write real
# journal files, it's a real production dependency, not a dev-only one.
serde_json = "1"
# T-5.1.3: the executor is the first `duet-ops` *production* code to need a
# real Tokio runtime, not just an `async fn` driven by whatever runtime the
# caller happens to run -- it spawns a bounded worker pool
# (`tokio::spawn`/`tokio::sync::Semaphore`) and a 100ms progress-sampling
# timer (`tokio::time::interval`) itself. `rt-multi-thread` (not just
# `rt`): per-device concurrency is only real concurrency, not cooperative
# interleaving, on a multi-threaded runtime -- a single-threaded one would
# make "concurrency respects rotational detection" untestable in the way
# T-5.1.1's own cancellation test already established the precedent for.
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3.12"
# T-5.1.3's executor tests need a `FileSystem` test double (wrapping
# `LocalFs`, overriding `server_side_copy` to force the naive fallback
# path or add an artificial delay) to deterministically exercise the
# pause-mid-copy and bounded-concurrency behaviours -- see
# `executor.rs`'s `TestFs`. Same reasoning `duet-vfs` itself already gives
# for depending on `async-trait`: real async-fn-in-trait isn't object-safe.
async-trait.workspace = true
# T-5.1.9's AC calls for "a property test over random conflict sequences" --
# already a workspace dependency (`duet-types`/`duet-index` use it for path
# round-tripping and mask matching per design.md §14.1), used here to hammer
# the sticky "apply to all" state machine across random-length conflict
# sequences and random trigger positions.
proptest.workspace = true
