[package]
name = "duet-ops"
description = "Operation engine: planner, executor, journal, queue, conflict policy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
duet-types = { path = "../duet-types" }
serde.workspace = true

[dev-dependencies]
# Only `duet-ops`'s own tests need a concrete wire format to round-trip
# through (T-2.3.1's AC: "a hand-written plan ... serialises and
# deserialises"); JSON is the obvious choice and is already precedented by
# spikes/s5-copy-ladder. Not promoted to [workspace.dependencies] since no
# other crate needs it yet.
serde_json = "1"
