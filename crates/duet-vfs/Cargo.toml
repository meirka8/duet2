[package]
name = "duet-vfs"
description = "FileSystem trait, registry, mount table, path resolution."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
duet-types = { path = "../duet-types" }
bitflags.workspace = true
async-trait.workspace = true
tokio.workspace = true
futures-core.workspace = true
futures-util.workspace = true
# `local` module only (T-3.1.x) -- see workspace Cargo.toml for the
# rationale on pinning/scope; every other module in this crate stays
# syscall-free.
rustix.workspace = true
rayon.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "io-util"] }
tempfile = "3.12"
