[package]
name = "duet-ui"
description = "Panels, tabs, dialogs, viewer, editor, palette -- the only other GPUI-aware layer besides duet-widgets -- ADR-002."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# T-4.1.1: window/lifecycle wiring (Application bootstrap, root view,
# theme init) lives here rather than in the `duet` binary crate, because
# ADR-002 restricts `gpui` to this crate and `duet-widgets` -- `duet`'s
# `main.rs` calls `duet_ui::run()` without ever importing gpui itself.
# Same pin as duet-widgets; see its Cargo.toml note.
#
# T-4.1.2: no `gpui-component` dependency here, deliberately -- R-G7's
# isolation is that `gpui-component` (the community widget crate) is only
# ever reached through `duet-widgets`'s façade (`duet_widgets::{table,
# list, input, select, menu, dialog, toast, resizable, theme, layout,
# compat}`). Plain `gpui` stays a direct dependency of this crate per
# ADR-002 -- the façade isolates `gpui-component` specifically, not GPUI
# itself.
gpui = "0.2.2"
duet-widgets = { path = "../duet-widgets" }
duet-types = { path = "../duet-types" }
duet-vfs = { path = "../duet-vfs" }
# T-4.2.1: `FileTable` (`src/file_table.rs`) renders a real
# `duet_index::DirectoryModel`/`EntryStore` -- the Phase 3 SoA panel model,
# not a parallel structure invented for the UI layer. `duet-index` stays
# gpui-free itself (ADR-002); this is the one-directional dependency that
# lets its gpui-aware *consumer* reach it.
duet-index = { path = "../duet-index" }
# T-4.1.4: the function-key bar's labels come from the real command
# catalogue + TC keymap survey, not hardcoded strings.
duet-commands = { path = "../duet-commands" }
# T-4.1.4/T-4.1.5: splitter-ratio persistence (settings.toml) and the theme
# token system (themes/*.toml, hot reload) both go through duet-config's
# existing round-trip/versioning/watch layer rather than duet-ui inventing
# its own file I/O.
duet-config = { path = "../duet-config" }
# T-5.2.1: the F5/F6 copy/move dialog (`src/copy_move_dialog.rs`) is the
# first thing in `duet-ui` to drive the operation engine -- `duet-ops`'s
# planner/executor/queue (T-5.1.1..T-5.1.13) are all already real and
# tested; this is only the UI wiring on top.
duet-ops = { path = "../duet-ops" }
# The executor-wiring demo (AC: "the core's async tasks drive UI updates
# through the foreground executor") needs a real multi-threaded Tokio
# runtime distinct from GPUI's own executor -- "rt-multi-thread" to build
# it, "sync" for the oneshot channel that bridges a background Tokio task's
# result back onto GPUI's foreground executor.
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
futures-util = { workspace = true }
tracing = { workspace = true }
# T-4.3.3: FR-NAV-13's quick-search fuzzy-subsequence scoring. Same crate
# (and exact version) `duet-commands`' command palette (T-4.3.6) already
# depends on, per design.md §9.2's own note that both features should
# reuse one fuzzy-matching implementation rather than carry two -- see
# `duet-commands/src/palette.rs`'s module doc comment for the identical
# reasoning. `duet-commands` doesn't re-export the crate, so this needs
# its own direct dependency line rather than reaching it transitively.
nucleo-matcher = "0.3.1"

[dev-dependencies]
# T-4.1.4: exercises splitter-ratio persistence against real temp files
# (see workspace.rs's tests module) -- the same crate duet-config already
# uses for its own file-round-trip tests.
tempfile = "3"
# T-4.3.2: `Panel`'s tab commands construct real `FileTable`/`TableState`
# entities, which need a live `Window` (see `panel.rs`'s `add_tab_entry`) --
# unlike `FileTableDelegate`'s own tests (plain Rust structs, no GPUI
# platform needed), there's no way to exercise `Panel` under plain `cargo
# test` without one. `test-support` is GPUI's own answer to exactly this
# (already proven out in `spikes/s6-text-input`'s headless IME/clipboard
# tests): a fake platform (`TestAppContext`) that `#[gpui::test]` spins up
# per test, real enough to construct real windows and entities but with no
# actual display connection.
gpui = { version = "0.2.2", features = ["test-support"] }
# T-4.2.1's 1M-row benchmark (`examples/bench_file_table.rs`) reuses
# T-3.3.4's deterministic in-memory corpus generator (`duet_bench::corpus`)
# rather than hand-rolling a second synthetic-entry generator. Dev-only:
# examples get dev-dependencies, and this benchmark harness has no business
# being part of the normal `duet-ui` library build.
duet-bench = { path = "../../benches" }
# T-5.2.2: `workspace.rs`'s own end-to-end operation-manager test needs a
# job that is still genuinely `Running` by the time the test opens the
# manager and drives Pause/Resume through it -- a real (fast, tmpfs-
# backed) copy finishes too quickly for that window to be observable. A
# small `FileSystem` test double delaying `open_read` is the fix, mirroring
# `duet-ops`'s own private `SlowFs` (`crates/duet-ops/src/queue.rs`'s test
# module, not reachable from here) -- implementing `duet_vfs::FileSystem`
# needs the same `#[async_trait]` attribute the trait itself is declared
# with (see that trait's own doc comment for why it isn't native
# async-fn-in-trait), so this dev-only dependency reaches the same version
# `duet-vfs`/`duet-ops` already pin via the workspace.
async-trait.workspace = true
