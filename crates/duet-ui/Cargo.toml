[package]
name = "duet-ui"
description = "Panels, tabs, dialogs, viewer, editor, palette -- the only other GPUI-aware layer besides duet-widgets -- ADR-002."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# T-4.1.1: window/lifecycle wiring (Application bootstrap, root view,
# theme init) lives here rather than in the `duet` binary crate, because
# ADR-002 restricts `gpui` to this crate and `duet-widgets` -- `duet`'s
# `main.rs` calls `duet_ui::run()` without ever importing gpui itself.
# Same pin as duet-widgets; see its Cargo.toml note.
#
# T-4.1.2: no `gpui-component` dependency here, deliberately -- R-G7's
# isolation is that `gpui-component` (the community widget crate) is only
# ever reached through `duet-widgets`'s façade (`duet_widgets::{table,
# list, input, select, menu, dialog, toast, resizable, theme, layout,
# compat}`). Plain `gpui` stays a direct dependency of this crate per
# ADR-002 -- the façade isolates `gpui-component` specifically, not GPUI
# itself.
gpui = "0.2.2"
duet-widgets = { path = "../duet-widgets" }
duet-types = { path = "../duet-types" }
duet-vfs = { path = "../duet-vfs" }
# T-4.1.4: the function-key bar's labels come from the real command
# catalogue + TC keymap survey, not hardcoded strings.
duet-commands = { path = "../duet-commands" }
# T-4.1.4/T-4.1.5: splitter-ratio persistence (settings.toml) and the theme
# token system (themes/*.toml, hot reload) both go through duet-config's
# existing round-trip/versioning/watch layer rather than duet-ui inventing
# its own file I/O.
duet-config = { path = "../duet-config" }
# The executor-wiring demo (AC: "the core's async tasks drive UI updates
# through the foreground executor") needs a real multi-threaded Tokio
# runtime distinct from GPUI's own executor -- "rt-multi-thread" to build
# it, "sync" for the oneshot channel that bridges a background Tokio task's
# result back onto GPUI's foreground executor.
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
futures-util = { workspace = true }
tracing = { workspace = true }
