[package]
name = "duet-search"
description = "Name + content search, mask/regex compiler, result streaming."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
duet-types = { path = "../duet-types" }
# Name masks compile to one byte regex each, and content search is a byte
# regex too (design.md §9.7: "regex via `regex`"). Both already in the
# lock file through other crates; this only names them directly.
regex = "1.11"
# The SIMD `memrchr` that finds the last line break of a read window.
memchr = "2.8"
# Encoding a literal content pattern into the legacy code pages the
# viewer also offers (windows-1252/1251/1255, KOI8-R).
encoding_rs = "0.8"
# `statfs` -- recognising /proc, /sys and friends when the walk crosses a
# mount point, so a search of `/` does not wander into them.
rustix.workspace = true
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3.12"
