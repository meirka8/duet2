[package]
name = "duet-widgets"
description = "GPUI facade over gpui-component (isolation layer for R-G7). ONLY this crate and duet-ui may depend on gpui/gpui-component -- ADR-002."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# T-4.1.1: the façade needs the real gpui-component dependency to call its
# `init()` (theme registry, icon font, widget-state globals) and to
# wrap every widget it re-exports (T-4.1.2). Pinned to the exact
# versions Phase 0's S-1 spike (`spikes/s1-virtualised-table`) validated --
# do not bump without re-running that spike's benchmark.
#
# T-4.1.3 / ADR-003 pin policy: these version strings and the exact
# versions recorded in the committed `Cargo.lock` (checked with
# `grep -A2 'name = "gpui"' Cargo.lock`) must match -- i.e. this is
# intended to resolve to exactly one version, not float across patches.
# gpui/gpui-component are pre-1.0 with documented breaking changes
# (design.md §7.4 R-G1), so bumping either is its own deliberate task
# with a compile-and-smoke gate (re-run S-1's benchmark, rebuild the
# workspace, relaunch and re-verify the app), never an incidental side
# effect of an unrelated change or a `cargo update`. Anything about the
# upstream API surface that turns out to be awkward or to have already
# shifted is wrapped in `src/compat.rs`, not worked around ad hoc at each
# call site.
gpui = "0.2.2"
gpui-component = "0.5.1"
