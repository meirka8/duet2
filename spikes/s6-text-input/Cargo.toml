[package]
name = "s6_text_input"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "s6_text_input"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
gpui-component = "0.5.1"
unicode-segmentation = "1.12"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

[profile.release]
debug = true
