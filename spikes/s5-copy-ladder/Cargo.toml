[package]
name = "s5-copy-ladder"
version = "0.1.0"
edition = "2021"
publish = false
description = "Phase 0 spike S-5: micro-benchmark ladder of Linux file-copy strategies (FICLONE, copy_file_range, buffered+fadvise, io_uring) vs cp/cp -a."

[[bin]]
name = "s5"
path = "src/main.rs"

[dependencies]
rustix = { version = "1.1", features = ["fs", "io_uring", "process", "system"] }
io-uring = "0.7"
libc = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
debug = false
lto = true
