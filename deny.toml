# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
#
# Runs in CI as the `supply-chain` job. Four checks:
#   advisories -- RustSec vulnerability/unmaintained/yanked database
#   licenses   -- every crate's license must be on the allow-list below
#   bans       -- duplicate versions are reported (warn, not deny: every
#                 duplicate in this graph today comes in through gpui)
#   sources    -- only crates.io and this repo's own `vendor/` path patches

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = false

[advisories]
version = 2
yanked = "deny"
# "Unmaintained" notices we cannot act on without bumping gpui itself
# (ADR-003 pins gpui 0.2.2; a bump is its own deliberate task). None is a
# vulnerability. Re-check this list at every gpui bump: an entry whose
# crate no longer appears in `cargo tree` should be dropped.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser (3 versions) via gpui/cosmic-text font stack" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz (2 versions) via gpui/cosmic-text font stack" },
    { id = "RUSTSEC-2025-0052", reason = "async-std via zed-async-tar, a gpui dependency" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile via zed-reqwest, gpui's http client" },
    { id = "RUSTSEC-2024-0436", reason = "paste via gpui-component, pulp and rav1e (gpui image stack)" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 via stacksafe-macro, a gpui dependency" },
    { id = "RUSTSEC-2024-0384", reason = "instant via notify-types 1.0 (notify 7); revisit at the next notify bump" },
]

[licenses]
version = 2
# Permissive licenses only. Copyleft (GPL/LGPL/AGPL) is deliberately absent:
# Duet is MIT and links everything statically.
allow = [
    "MIT",
    "MIT-0",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
